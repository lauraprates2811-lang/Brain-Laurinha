<style>
/* Layout: uma aula em slides, abas das 3 partes no topo, laboratório de peças no centro */
:root{
  --bg:#f3f5fb; --card:#ffffff; --ink:#1d2340; --muted:#5b6386; --line:#dde1ef;
  --accent:#3b5bdb; --accent-soft:#e3e9ff; --good:#1f8f5f; --good-soft:#dcf5e9; --bad:#c2410c; --bad-soft:#ffe8dc;
  --metal:#3b5bdb; --nonmetal:#e8590c;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12152a; --card:#1c2140; --ink:#eef0fb; --muted:#a3a9c9; --line:#2f3660;
  --accent:#8ea2ff; --accent-soft:#2a3366; --good:#5fd6a0; --good-soft:#163a2c; --bad:#ff9a6b; --bad-soft:#41241a;
  --metal:#8ea2ff; --nonmetal:#ff9a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152a; --card:#1c2140; --ink:#eef0fb; --muted:#a3a9c9; --line:#2f3660;
  --accent:#8ea2ff; --accent-soft:#2a3366; --good:#5fd6a0; --good-soft:#163a2c; --bad:#ff9a6b; --bad-soft:#41241a;
  --metal:#8ea2ff; --nonmetal:#ff9a6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1;min-width:150px;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:8px 12px;font:600 .95rem var(--body);cursor:pointer;text-align:left}
.tab small{display:block;font-weight:400;font-size:.8rem}
.tab.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.slide{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:340px}
.slide.enter{animation:in .35s ease}
@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.en{color:var(--muted);font-size:.9rem}
.nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
button{font-family:var(--body)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--accent);color:#fff}
:root:not([data-theme="light"]) .btn{color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.step button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.counter{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

@media (max-width:560px){.grid2{grid-template-columns:1fr}.slide{padding:16px}}
.box{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}

</style>

<script>
const COLORS={H:'#8d93a8',Cl:'#2f9e44',Na:'#7048e8',O:'#e03131',Fe:'#a0522d',Ca:'#0c8599',N:'#364fc7',C:'#343a40',P:'#e8590c',Mg:'#5c940d',Li:'#c2255c',Al:'#868e96'};
const atom=(el)=>`<span class="atom" style="background:${COLORS[el]||'#666'}">${el}</span>`;
const molHTML=(atoms)=>`<span class="mol">${Object.entries(atoms).map(([e,n])=>atom(e).repeat(n)).join('')}</span>`;

const PARTS=[
 {name:'Parte 1',sub:'Física × química'},
 {name:'Parte 2',sub:'Cargas e fórmulas'},
 {name:'Parte 3',sub:'Balanceamento'}
];

/* ---------- slides ---------- */
const S=[];

S.push({part:0,html:`
<span class="eyebrow">Parte 1 · Physical vs Chemical change</span>
<h2>Uma pergunta resolve tudo</h2>
<p class="big">“Virou outra coisa?”</p>
<div class="grid2">
 <div class="box p"><span class="tag">Não virou → Física (P)</span><p>A substância continua a mesma. Só muda a forma ou o estado.</p><p class="en">Physical change</p></div>
 <div class="box c"><span class="tag">Virou → Química (C)</span><p>Apareceu uma substância nova, que não existia antes.</p><p class="en">Chemical change</p></div>
</div>
<p>Gelo derretendo continua sendo água, então é <b>P</b>. Leite azedando virou outra coisa, então é <b>C</b>.</p>`});

S.push({part:0,html:`
<span class="eyebrow">Parte 1</span>
<h2>As pistas</h2>
<div class="grid2">
 <div class="box p"><span class="tag">Pistas de física</span><ul><li>derreter, congelar, ferver</li><li>quebrar, rasgar, cortar, amassar</li><li>dissolver (açúcar na água)</li></ul></div>
 <div class="box c"><span class="tag">Pistas de química</span><ul><li><b>bolhas de gás</b> (gas is produced)</li><li><b>sólido novo</b> (a new solid forms)</li><li>muda de cor, cheiro novo</li><li>fogo, ferrugem, estragar, cozinhar</li></ul></div>
</div>
<p>Na questão 13 da folha, as duas certas são <b>“a new solid forms”</b> e <b>“gas is produced”</b>. Mudar de formato e derreter são físicas.</p>`});

S.push({part:0,html:`
<span class="eyebrow">Parte 1 · a pegadinha</span>
<h2>“A cera derretida parece diferente, então é química”</h2>
<p>Está <b>errado</b>. Parecer diferente não importa. O que importa é se formou uma <b>substância nova</b>.</p>
<div class="box g"><span class="tag">Como responder (em inglês)</span>
<p>“This idea is wrong because melting wax is a physical change. The wax only changes from solid to liquid. No new substance is formed, it is still wax.”</p></div>`});

const P1Q=[['A scoop of ice cream melts','P','Continua sendo sorvete, só mudou de estado.'],
 ['Milk becomes sour','C','O leite virou outra substância (cheiro e gosto novos).'],
 ['A glass bottle shatters','P','Continua vidro, só em pedaços.'],
 ['Vinegar + baking soda make bubbles','C','Bolhas de gás = substância nova.'],
 ['Wood burns in a fire','C','Virou cinza e fumaça.'],
 ['Sugar dissolves in water','P','O açúcar continua lá, só se misturou.']];
S.push({part:0,quiz:'p1',html:`
<span class="eyebrow">Parte 1 · treino</span>
<h2>P ou C?</h2>
<div id="p1"></div><p class="fb" id="p1score"></p>`});

S.push({part:1,html:`
<span class="eyebrow">Parte 2 · Ion charges</span>
<h2>Metal dá, ametal pega</h2>
<div class="grid2">
 <div class="box p"><span class="tag">Metais (lado esquerdo)</span><p><b>Perdem</b> elétrons e ficam <span class="plus">positivos (+)</span>.</p></div>
 <div class="box c"><span class="tag">Ametais (lado direito)</span><p><b>Ganham</b> elétrons e ficam <span class="minus">negativos (−)</span>.</p></div>
</div>
<div class="xdemo"><span class="ion">Na</span><span class="fly" style="font-size:1rem">e⁻ →</span><span class="ion">Cl</span><span style="font-size:1.4rem;color:var(--muted)">vira</span><span class="ion"><span class="plus">Na<sup>+</sup></span></span><span class="ion"><span class="minus">Cl<sup>−</sup></span></span></div>
<p>Por que perder deixa positivo? Porque o elétron é <b>negativo</b>. Quem perde uma coisa negativa fica mais positivo.</p>`});

S.push({part:1,html:`
<span class="eyebrow">Parte 2</span>
<h2>A carga vem do grupo</h2>
<div class="scroll"><table>
<tr><th>Grupo</th><th>Carga</th><th>Exemplos</th></tr>
<tr><td>1</td><td class="plus">+1</td><td>Li, Na, K</td></tr>
<tr><td>2</td><td class="plus">+2</td><td>Mg, Ca</td></tr>
<tr><td>13</td><td class="plus">+3</td><td>Al</td></tr>
<tr><td>15</td><td class="minus">−3</td><td>N, P</td></tr>
<tr><td>16</td><td class="minus">−2</td><td>O, S</td></tr>
<tr><td>17</td><td class="minus">−1</td><td>Cl, Br</td></tr>
</table></div>
<p class="en">Mg está no grupo 2, perde 2 elétrons e vira Mg²⁺ (questão 5 da folha: +2).</p>`});

S.push({part:1,html:`
<span class="eyebrow">Parte 2 · o truque do X</span>
<h2>Montar a fórmula neutra</h2>
<p>O número da carga de um vira o número pequeno do outro.</p>
<div class="xdemo"><span class="ion">Al<sup class="plus">3+</sup></span><span style="font-size:1.6rem;color:var(--muted)">✕</span><span class="ion">O<sup class="minus">2−</sup></span><span style="color:var(--muted)">→</span><span>Al<sub>2</sub>O<sub>3</sub></span></div>
<div class="box g"><span class="tag">Conferindo: tem que dar zero</span><p>2 Al × (+3) = <span class="plus">+6</span> e 3 O × (−2) = <span class="minus">−6</span>. Somando, +6 − 6 = <b>0</b> ✓</p></div>
<p>Esta é a questão 8 da folha. A dica “+6 e −6” é exatamente isso.</p>`});

S.push({part:1,html:`
<span class="eyebrow">Parte 2 · a pegadinha</span>
<h2>Números iguais: não cruza</h2>
<div class="xdemo"><span class="ion">Ca<sup class="plus">2+</sup></span><span style="color:var(--muted)">+</span><span class="ion">O<sup class="minus">2−</sup></span><span style="color:var(--muted)">→</span><span>CaO</span></div>
<p>+2 e −2 já dão zero com um de cada. Ca₂O₂ está <b>errado</b>, porque a fórmula usa sempre os <b>menores números</b>.</p>
<p>Outros exemplos: Mg²⁺ + O²⁻ = <b>MgO</b>. Na⁺ + Cl⁻ = <b>NaCl</b>.</p>`});

S.push({part:1,html:`
<span class="eyebrow">Parte 2 · Covalent bonds</span>
<h2>Quantas ligações o ametal faz</h2>
<p>Entre <b>dois ametais</b> ninguém dá elétron, eles <b>compartilham</b>. A conta é 8 − elétrons de valência.</p>
<div class="scroll"><table>
<tr><th>Grupo</th><th>Ligações</th><th>Exemplos</th></tr>
<tr><td>14</td><td>4</td><td>C</td></tr><tr><td>15</td><td>3</td><td>N, P</td></tr>
<tr><td>16</td><td>2</td><td>O, S</td></tr><tr><td>17</td><td>1</td><td>Cl, Br</td></tr></table></div>
<ul><li>Mesmo grupo = mesmo número de ligações (N e P).</li><li>Dois ametais = covalente. Metal + ametal = iônica.</li></ul>`});

const P2Q=[['Na',1,'Cl',-1],['Mg',2,'Cl',-1],['Li',1,'O',-2],['Ca',2,'O',-2],['Al',3,'Cl',-1],['Al',3,'O',-2]];
S.push({part:1,quiz:'p2',html:`
<span class="eyebrow">Parte 2 · treino</span>
<h2>Monte a fórmula até a carga dar zero</h2>
<div class="pick" id="p2pick"></div>
<div id="p2"></div>`});

S.push({part:2,html:`
<span class="eyebrow">Parte 3 · Balancing equations</span>
<h2>Pense em peças de Lego</h2>
<p>Cada fórmula é uma <b>peça já montada</b>. Não dá para desmontar.</p>
<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">
 <span>O₂ = ${molHTML({O:2})}</span><span>Na₂O = ${molHTML({Na:2,O:1})}</span></div>
<p>O número da frente (coeficiente) diz <b>quantas peças você pegou</b>. Você nunca muda os números pequenos.</p>
<div class="box g"><span class="tag">A regra</span><p>No fim, cada cor de bolinha tem que aparecer a <b>mesma quantidade</b> dos dois lados da seta.</p></div>`});

S.push({part:2,lab:{eq:0,guided:true},html:`
<span class="eyebrow">Parte 3 · primeiro juntas</span>
<h2>H₂ + Cl₂ → HCl</h2>
<p>A direita tem só 1 H e 1 Cl. Aperte <b>+</b> embaixo do HCl e veja as peças aparecerem.</p>
<div id="lab"></div>`});

S.push({part:2,lab:{eq:1},html:`
<span class="eyebrow">Parte 3 · agora você</span>
<h2>Na + O₂ → Na₂O</h2>
<p>Dica: arrume o <b>O</b> primeiro (mexa no Na₂O), depois o Na.</p>
<div id="lab"></div>`});

S.push({part:2,lab:{eq:2,pick:true},html:`
<span class="eyebrow">Parte 3 · laboratório</span>
<h2>Todas as equações da folha</h2>
<p>Escolha uma e balanceie. Ordem que ajuda: <b>metais → ametais → H → O por último</b>.</p>
<div class="pick" id="eqpick"></div>
<div id="lab"></div>`});

S.push({part:2,html:`
<span class="eyebrow">Antes de entregar</span>
<h2>Checklist do quiz</h2>
<div class="box g"><ul>
<li>Contei cada elemento dos dois lados e deu igual.</li>
<li>Mudei <b>só os coeficientes</b>, nunca os números pequenos.</li>
<li>Usei os menores números inteiros (se todos dão para dividir por 2, divida).</li>
<li>Sei explicar por que a fórmula iônica tem carga total zero: as cargas + e − se cancelam.</li></ul></div>
<p>Se travar, volte para a pergunta-chave de cada parte: <b>virou outra coisa?</b> · <b>a carga deu zero?</b> · <b>as bolinhas estão iguais?</b></p>`});

/* ---------- equações ---------- */
const EQ=[
 {n:'H₂ + Cl₂ → HCl',L:[['H₂',{H:2}],['Cl₂',{Cl:2}]],R:[['HCl',{H:1,Cl:1}]]},
 {n:'Na + O₂ → Na₂O',L:[['Na',{Na:1}],['O₂',{O:2}]],R:[['Na₂O',{Na:2,O:1}]]},
 {n:'Fe + Cl₂ → FeCl₃',L:[['Fe',{Fe:1}],['Cl₂',{Cl:2}]],R:[['FeCl₃',{Fe:1,Cl:3}]]},
 {n:'Ca + N₂ → Ca₃N₂',L:[['Ca',{Ca:1}],['N₂',{N:2}]],R:[['Ca₃N₂',{Ca:3,N:2}]]},
 {n:'C₃H₈ + O₂ → CO₂ + H₂O',L:[['C₃H₈',{C:3,H:8}],['O₂',{O:2}]],R:[['CO₂',{C:1,O:2}],['H₂O',{H:2,O:1}]]},
 {n:'NH₃ + O₂ → NO + H₂O',L:[['NH₃',{N:1,H:3}],['O₂',{O:2}]],R:[['NO',{N:1,O:1}],['H₂O',{H:2,O:1}]],hard:1},
 {n:'P₄ + O₂ → P₂O₅',L:[['P₄',{P:4}],['O₂',{O:2}]],R:[['P₂O₅',{P:2,O:5}]],hard:1}
];
let lab={eq:0,co:[]};
const gcd=(a,b)=>b?gcd(b,a%b):a;
function resetLab(i){lab.eq=i;const e=EQ[i];lab.co=Array(e.L.length+e.R.length).fill(1)}
function renderLab(){
 const box=document.getElementById('lab');if(!box)return;
 const e=EQ[lab.eq],all=[...e.L,...e.R],nL=e.L.length;
 const spec=(s,k)=>`<div class="sp"><span class="formula">${s[0]}</span><div class="step"><button aria-label="menos ${s[0]}" data-k="${k}" data-d="-1">−</button><b>${lab.co[k]}</b><button aria-label="mais ${s[0]}" data-k="${k}" data-d="1">+</button></div></div>`;
 let eqH='';all.forEach((s,k)=>{if(k===nL)eqH+='<span class="arrow">→</span>';else if(k>0)eqH+='<span class="arrow" style="font-size:1.1rem">+</span>';eqH+=spec(s,k)});
 const tray=(side,off)=>side.map((s,j)=>Array.from({length:lab.co[off+j]},()=>molHTML(s[1])).join('')).join('');
 const els=[...new Set(all.flatMap(s=>Object.keys(s[1])))];
 const cnt=(side,off,el)=>side.reduce((t,s,j)=>t+(s[1][el]||0)*lab.co[off+j],0);
 let ok=true,rows='';
 els.forEach(el=>{const a=cnt(e.L,0,el),b=cnt(e.R,nL,el),g=a===b;if(!g)ok=false;
  rows+=`<tr><td>${atom(el)}</td><td>${a}</td><td>${b}</td><td class="st" style="color:var(${g?'--good':'--bad'})">${g?'✓ igual':'✗ diferente'}</td></tr>`});
 const small=lab.co.reduce(gcd)===1;
 let msg=ok?(small?`<div class="result" style="background:var(--good-soft);color:var(--good)">Balanceada! ${lab.co.map((c,k)=>(c>1?c:'')+all[k][0]).join(' ').replace(/ /g,' + ').replace(' + '+all[nL][0],' → '+all[nL][0])}</div>`
  :`<div class="result" style="background:var(--bad-soft);color:var(--bad)">Os lados estão iguais, mas dá para dividir todos os números. Use os menores.</div>`)
  :`<div class="result" style="background:var(--accent-soft);color:var(--ink)">Ainda não. Olhe a linha com ✗ e pegue mais peças do lado que tem menos.</div>`;
 if(e.hard&&!ok)msg+=`<p class="en">Questão difícil. ${lab.eq===5?'Comece igualando N e H (NH₃ e H₂O), depois o O. Se o O der número ímpar, dobre tudo.':'Iguale o P primeiro (P₂O₅), depois o O.'}</p>`;
 box.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
  <div class="eq">${eqH}</div>
  <div class="trays"><div class="tray"><h3>Antes da seta (reagentes)</h3>${tray(e.L,0)}</div><div class="tray"><h3>Depois da seta (produtos)</h3>${tray(e.R,nL)}</div></div>
  <div class="scroll"><table class="count"><tr><th>Átomo</th><th>Esquerda</th><th>Direita</th><th></th></tr>${rows}</table></div>${msg}</div>`;
 box.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;lab.co[k]=Math.max(1,Math.min(12,lab.co[k]+ +b.dataset.d));renderLab()});
}

/* ---------- quizzes ---------- */
const p1ans={};
function renderP1(){
 const box=document.getElementById('p1');if(!box)return;
 box.innerHTML=P1Q.map((q,i)=>`<div class="q"><span class="txt">${i+1}. ${q[0]}</span>
  ${['P','C'].map(x=>`<button class="chip ${p1ans[i]===x?(x===q[1]?'ok':'no'):''}" data-i="${i}" data-x="${x}">${x}</button>`).join('')}
  <span class="fb ${p1ans[i]?(p1ans[i]===q[1]?'ok':'no'):''}" style="width:100%">${p1ans[i]?(p1ans[i]===q[1]?'Certo! ':'Quase. ')+q[2]:''}</span></div>`).join('');
 box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{p1ans[b.dataset.i]=b.dataset.x;renderP1()});
 const n=Object.keys(p1ans).length,c=Object.entries(p1ans).filter(([i,x])=>P1Q[i][1]===x).length;
 document.getElementById('p1score').textContent=n?`${c} de ${P1Q.length} certas`:'';
}
let p2={i:0,a:1,b:1};
const sup=n=>{const a=Math.abs(n);return (a>1?a:'')+(n>0?'+':'−')};
const sub=n=>n>1?String(n).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]).join(''):'';
function renderP2(){
 const pick=document.getElementById('p2pick'),box=document.getElementById('p2');if(!box)return;
 pick.innerHTML=P2Q.map((q,i)=>`<button class="chip ${i===p2.i?'ok':''}" data-i="${i}">${q[0]}${sup(q[1])} + ${q[2]}${sup(q[3])}</button>`).join('');
 pick.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{p2={i:+b.dataset.i,a:1,b:1};renderP2()});
 const [m,cm,n,cn]=P2Q[p2.i],tot=p2.a*cm+p2.b*cn,small=gcd(p2.a,p2.b)===1;
 const ions=(el,c,k)=>Array.from({length:k},()=>`<span class="mol" style="padding:6px 10px;font:600 1rem var(--display)">${el}<sup class="${c>0?'plus':'minus'}">${sup(c)}</sup></span>`).join('');
 const st=(id,v,l)=>`<div class="sp"><span class="en">${l}</span><div class="step"><button data-w="${id}" data-d="-1" aria-label="menos ${l}">−</button><b>${v}</b><button data-w="${id}" data-d="1" aria-label="mais ${l}">+</button></div></div>`;
 let msg;
 if(tot===0&&small)msg=`<div class="result" style="background:var(--good-soft);color:var(--good)">Zero! A fórmula é ${m}${sub(p2.a)}${n}${sub(p2.b)}</div>`;
 else if(tot===0)msg=`<div class="result" style="background:var(--bad-soft);color:var(--bad)">Deu zero, mas dá para usar números menores. Divida os dois.</div>`;
 else msg=`<div class="result" style="background:var(--accent-soft);color:var(--ink)">Carga total: ${tot>0?'+':''}${tot}. ${tot>0?`Sobrou positivo: precisa de mais ${n}.`:`Sobrou negativo: precisa de mais ${m}.`}</div>`;
 box.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
  <div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap">${st('a',p2.a,'quantos '+m)}${st('b',p2.b,'quantos '+n)}</div>
  <div class="tray" style="justify-content:center">${ions(m,cm,p2.a)}${ions(n,cn,p2.b)}</div>
  <p style="text-align:center;font-variant-numeric:tabular-nums">${p2.a} × (<span class="plus">${cm>0?'+':''}${cm}</span>) + ${p2.b} × (<span class="minus">${cn}</span>) = <b>${tot}</b></p>${msg}</div>`;
 box.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{p2[b.dataset.w]=Math.max(1,Math.min(6,p2[b.dataset.w]+ +b.dataset.d));renderP2()});
}

/* ---------- navegação ---------- */
let cur=0;
try{const s=+localStorage.getItem('quim23');if(s>=0&&s<S.length)cur=s}catch(e){}
function go(i){
 cur=Math.max(0,Math.min(S.length-1,i));
 try{localStorage.setItem('quim23',cur)}catch(e){}
 const s=S[cur],el=document.getElementById('slide');
 el.innerHTML=s.html;el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');
 if(s.lab){
  if(s.lab.pick){const pk=document.getElementById('eqpick');
   const draw=()=>{pk.innerHTML=EQ.slice(2).map((e,j)=>`<button class="chip ${lab.eq===j+2?'ok':''}" data-e="${j+2}">${e.n}${e.hard?' ★':''}</button>`).join('');
    pk.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{resetLab(+b.dataset.e);draw();renderLab()})};
   if(lab.eq<2)resetLab(2);draw();
  } else resetLab(s.lab.eq);
  renderLab();
 }
 if(s.quiz==='p1')renderP1();
 if(s.quiz==='p2')renderP2();
 document.getElementById('tabs').innerHTML=PARTS.map((p,k)=>`<button class="tab ${s.part===k?'on':''}" data-k="${k}">${p.name}<small>${p.sub}</small></button>`).join('');
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(S.findIndex(x=>x.part===+t.dataset.k)));
 document.getElementById('prog').style.width=((cur+1)/S.length*100)+'%';
 document.getElementById('count').textContent=`${cur+1} / ${S.length}`;
 document.getElementById('prev').disabled=cur===0;
 const nx=document.getElementById('next');nx.disabled=cur===S.length-1;
}
document.getElementById('prev').onclick=()=>{go(cur-1);scrollTo({top:0,behavior:'smooth'})};
document.getElementById('next').onclick=()=>{go(cur+1);scrollTo({top:0,behavior:'smooth'})};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
go(cur);
</script>
